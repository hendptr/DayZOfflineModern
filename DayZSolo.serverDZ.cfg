// DayZ Solo: dedicated server for saved singleplayer survival.
// A private mission copy is created by Play-Persistent.ps1.
hostname = "DayZ Solo - Local Survival";
description = "Private, local-only in intended use. One player, persistent survivor and world.";
password = "";
passwordAdmin = "";
maxPlayers = 1;
verifySignatures = 2;
forceSameBuild = 1;
BattlEye = 0;
disableVoN = 1;
disable3rdPerson = 0;
disableCrosshair = 0;
disablePersonalLight = 0;
serverTime = "2026/9/20/12/00";
serverTimePersistent = 1;
serverTimeAcceleration = 1;
serverNightTimeAcceleration = 2;
timeStampFormat = "Short";
logFile = "DayZSolo_server.log";
logAverageFps = 60;
loginQueueConcurrentPlayers = 1;
loginQueueMaxPlayers = 1;
steamQueryPort = 27016;
instanceId = 15;
storageAutoFix = 1;
enableCfgGameplayFile = 1;

class Missions
{
    class DayZ
    {
        template = "dayzSolo.chernarusplus";
    };
};
